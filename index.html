<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Verbindungs-Check Generator</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
  body { 
    font-family: Arial; 
    padding: 20px; 
    background: #f5f5f5;
  }

  h2, h3 {
    margin-top: 25px;
  }

  input, select, textarea {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
  }

  textarea {
    background: #fff;
    border: 1px solid #bbb;
  }

  button {
    padding: 12px 18px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #0078ff;
    color: white;
    margin-top: 10px;
  }

  button:hover {
    background: #005fcc;
  }

  #copyBtn {
    background: #28a745;
  }

  #copyBtn:hover {
    background: #1e7e34;
  }
</style>

</head>
<body>

<h2>Screenshot hochladen</h2>
<input type="file" id="imageInput" accept="image/*">

<button onclick="runOCR()">OCR starten</button>

<h3>Erkannte Daten (korrigierbar)</h3>

<label>Auftragsnummer</label>
<input id="nummer">

<label>Standort (Adresse)</label>
<input id="standort">

<label>Filiale</label>
<input id="filiale">

<h3>Manuelle Eingaben</h3>

<label>Router / Geräte IP</label>
<input id="ip">

<label>Eingang</label>
<select id="eingang">
  <option value="2x NP14 (2x PAB)">2x NP14 (2x PAB)</option>
  <option value="1x NP14">1x NP14</option>
  <option value="2x NP8">2x NP8</option>
  <option value="1x NP8">1x NP8</option>
  <option value="2x PAB">2x PAB</option>
</select>

<label>Kassen</label>
<select id="kassen">
  <option value="2x Kassenantennen">2x Kassenantennen</option>
  <option value="1x Kassenantenne">1x Kassenantenne</option>
  <option value="4x Kassenantennen">4x Kassenantennen</option>
</select>

<button onclick="generateText()">Text generieren</button>

<h3>Ergebnis</h3>
<textarea id="output" rows="12"></textarea>

<button id="copyBtn">In Zwischenablage kopieren</button>

<script>
function runOCR() {
  const file = document.getElementById("imageInput").files[0];
  if (!file) { alert("Bitte Screenshot auswählen"); return; }

Tesseract.recognize(file, 'deu')
  .then(result => {
    const text = result.data.text;

    // Zeilen splitten
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    // Debug-Ausgabe: alle Zeilen anzeigen
    let debugOutput = "OCR erkannte folgende Zeilen:\n\n";
    lines.forEach((line, index) => {
      debugOutput += `${index + 1}: ${line}\n`;
    });
    document.getElementById("output").value = debugOutput;

    // -----------------------------
    // Auftragsnummer (erste 6–8-stellige Zahl)
    // -----------------------------
    const nummer = (text.match(/\b\d{6,8}\b/) || [''])[0];
    document.getElementById("nummer").value = nummer;

    // -----------------------------
    // Filiale: "MARKT Dxxx" suchen und auf die letzten 4 Zeichen kürzen
    // -----------------------------
    let filiale = "";

    // Suche nach "MARKT Dxxx"
    const filialeMatch = text.match(/MARKT D[A-Z0-9]{3}/);

    if (filialeMatch) {
      // Filialnummer = die letzten 4 Zeichen
      filiale = filialeMatch[0].slice(-4);
    }

    document.getElementById("filiale").value = filiale;

    // -----------------------------
    // Adresse: Zeilen nach der Filialzeile
    // -----------------------------
    let streetLine = "";
    let cityLine = "";

    // Filialzeile finden (über die 4-stellige Filialnummer)
    const filialeIndex = lines.findIndex(l => l.includes(filiale));

    if (filialeIndex >= 0) {
      streetLine = lines[filialeIndex + 1] || "";
      cityLine   = lines[filialeIndex + 2] || "";
    }

    const adresse = `${streetLine}, ${cityLine}`.trim();
    document.getElementById("standort").value = adresse;
  });

}

function generateText() {
  const nummer = document.getElementById("nummer").value;
  const standort = document.getElementById("standort").value;
  
  const filiale = document.getElementById("filiale").value;
  const ip = document.getElementById("ip").value;
  const eingang = document.getElementById("eingang").value;
  const kassen = document.getElementById("kassen").value;

  const output = `
Bitte Verbindung prüfen:

Auftragsnummer:
${nummer}

Filiale:
${filiale}

Adresse:
${standort}

Eingang:
${eingang}
${ip}

Kassen:
${kassen}

Router / Geräte IP:
${ip}
  `;

  document.getElementById("output").value = output.trim();
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const text = document.getElementById("output").value;

  navigator.clipboard.writeText(text)
    .then(() => {
      alert("Text wurde in die Zwischenablage kopiert!");
    })
    .catch(err => {
      alert("Fehler beim Kopieren: " + err);
    });
});

</script>

</body>
</html>
